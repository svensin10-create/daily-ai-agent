name: Daily AI Agent

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC (8 AM Eastern during daylight time)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to save reports back into the repo
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Run agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are a daily research assistant. Today is ${{ env.TODAY }}.
            1. Read task.txt: those are your instructions (lines starting with # are comments).
            2. Read sources.txt and fetch each feed URL with WebFetch to get today's headlines.
               If a feed fails, skip it and keep going.
            3. Use WebSearch and WebFetch to check the details of the stories you pick. Link each story
               to the original article when you can find it, otherwise to the feed link.
            Write the brief to outputs/${{ env.TODAY }}.md and make its first line exactly:
            # Agent report: ${{ env.TODAY }}
            Never invent facts, numbers, or links. Do not create or change any other files.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Write,WebSearch,WebFetch"

      - name: Check the report was written
        run: test -s "outputs/$TODAY.md" || { echo "::error::No report was written to outputs/$TODAY.md"; exit 1; }

      - name: Save report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --staged --quiet || git commit -m "Agent report $(date -u +%F)"
          git pull --rebase
          git push

name: Market Watcher

on:
  schedule:
    - cron: "30 11 * * 1-5"   # weekdays 11:30 UTC (7:30 AM Eastern in daylight time)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set today's date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Run market agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are a market analyst. Today is ${{ env.TODAY }}.
            1. Read market_task.txt: those are your instructions (lines starting with # are comments).
            2. Read market_sources.txt and fetch each feed URL with WebFetch to get today's headlines.
               If a feed fails, skip it and keep going.
            3. Use WebSearch and WebFetch to check the details of the stories you pick. Link each story
               to the original article when you can find it, otherwise to the feed link.
            Write the brief to market/${{ env.TODAY }}.md and make its first line exactly:
            # Market report: ${{ env.TODAY }}
            Never invent facts, numbers, or links. Do not create or change any other files.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Write,WebSearch,WebFetch"
      - name: Check the report was written
        run: test -s "market/$TODAY.md" || { echo "::error::No report was written to market/$TODAY.md"; exit 1; }
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market
          git diff --staged --quiet || git commit -m "Market report $(date -u +%F)"
          git pull --rebase
          git push
